<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransVid Studio - AI Video Translation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-8 shadow-2xl space-y-6">
            <div class="text-center">
                <div class="bg-indigo-600 w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-3 text-white shadow-lg">
                    <i class="fa-solid fa-video text-xl"></i>
                </div>
                <h2 class="text-xl font-bold text-white tracking-wide">TransVid Studio</h2>
                <p class="text-xs text-slate-400 mt-1">Sign in or enter Admin ID (Risingstar)</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Email or Admin ID</label>
                    <input type="text" id="auth-email" placeholder="name@example.com or Risingstar" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" value="Risingstar">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input type="password" id="auth-password" placeholder="Password" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" value="risingstar24">
                </div>
                <button onclick="handleAuthSubmit()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-lg text-xs font-bold transition shadow-lg">
                    Access Studio
                </button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-video text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white">TransVid Studio</h1>
                    <p class="text-xs text-indigo-400">AI Video Translation</p>
                </div>
            </div>
            <button onclick="openAdminModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-700">
                <i class="fa-solid fa-lock mr-1"></i> Admin Dashboard
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 space-y-6">
        
        <!-- Upload Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">
            <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-3">
                <i class="fa-solid fa-cloud-arrow-up text-indigo-400 mr-2"></i> Select Video File
            </h2>
            <div class="border-2 border-dashed border-slate-800 hover:border-indigo-500 rounded-xl p-6 text-center cursor-pointer bg-slate-950/50" onclick="document.getElementById('video-file-input').click()">
                <p id="file-label-text" class="text-xs text-slate-300">Tap here to choose video from phone/PC</p>
                <input type="file" id="video-file-input" class="hidden" accept="video/*" onchange="handleFileSelect(event)">
            </div>

            <div class="grid grid-cols-2 gap-4 mt-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Target Language</label>
                    <select id="target-lang" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200">
                        <option value="myanmar">မြန်မာ (Myanmar)</option>
                        <option value="mizo">Mizo</option>
                        <option value="english">English</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">AI Voice</label>
                    <select id="voice-gender" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200">
                        <option value="female">Female Voice</option>
                        <option value="male">Male Voice</option>
                    </select>
                </div>
            </div>

            <button onclick="startTranslation()" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-lg text-xs font-bold transition">
                START TRANSLATION
            </button>
        </div>

        <!-- Video Player & Subtitles -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">
            <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-3">
                <i class="fa-solid fa-play-circle text-emerald-400 mr-2"></i> Playback & Subtitles
            </h2>
            
            <div class="relative bg-slate-950 rounded-lg overflow-hidden aspect-video flex items-center justify-center border border-slate-800">
                <div id="player-placeholder" class="text-center p-6 text-xs text-slate-500">
                    Upload video and click Start Translation
                </div>
                <video id="actual-video-player" class="hidden w-full h-full object-contain bg-black" controls playsinline></video>

                <div id="subtitle-overlay" class="hidden absolute bottom-4 left-3 right-3 text-center bg-slate-900/90 backdrop-blur border border-slate-700/50 py-2 px-3 rounded-lg z-10">
                    <p id="preview-subtitle-text" class="text-xs md:text-sm font-semibold text-white">"..."</p>
                    <button onclick="speakCurrentSubtitle()" class="mt-1 text-[10px] bg-emerald-600 text-white px-2 py-1 rounded">
                        <i class="fa-solid fa-volume-high mr-1"></i> Speak Audio
                    </button>
                </div>
            </div>

            <!-- Transcript List -->
            <div id="transcript-section" class="hidden mt-4 space-y-2 max-h-40 overflow-y-auto">
                <div id="transcript-list" class="space-y-2 text-xs"></div>
            </div>
        </div>

    </main>

    <!-- Admin Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="text-sm font-bold text-white mb-4"><i class="fa-solid fa-shield-halved text-rose-500 mr-2"></i> Admin Panel</h3>
            <p class="text-xs text-slate-300 mb-4">Status: <strong class="text-indigo-400">Unlimited Admin Access Active</strong></p>
            <button onclick="closeAdminModal()" class="w-full bg-slate-800 text-slate-300 py-2 rounded-lg text-xs">Close</button>
        </div>
    </div>

    <script>
        let selectedVideoFileUrl = null;
        let subtitlesData = [];

        function handleAuthSubmit() {
            const id = document.getElementById('auth-email').value.trim();
            const pw = document.getElementById('auth-password').value;
            if(id === 'Risingstar' && pw === 'risingstar24') {
                document.getElementById('auth-modal').classList.add('hidden');
            } else {
                alert('Invalid Credentials! Use Risingstar / risingstar24');
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if(file) {
                selectedVideoFileUrl = URL.createObjectURL(file);
                document.getElementById('file-label-text').innerHTML = `<span class="text-emerald-400 font-semibold">${file.name} ready</span>`;
            }
        }

        function startTranslation() {
            const lang = document.getElementById('target-lang').value;
            const placeholder = document.getElementById('player-placeholder');
            const videoPlayer = document.getElementById('actual-video-player');

            placeholder.classList.add('hidden');
            videoPlayer.classList.remove('hidden');

            if(selectedVideoFileUrl) {
                videoPlayer.src = selectedVideoFileUrl;
            } else {
                videoPlayer.src = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4";
            }
            videoPlayer.load();
            videoPlayer.play().catch(e => console.log(e));

            if(lang === 'myanmar') {
                subtitlesData = [
                    { start: 0, end: 4, text: "မင်္ဂလာပါ၊ ဗီဒီယို ဘာသာပြန်စနစ် အဆင်သင့်ဖြစ်ပါပြီ။" },
                    { start: 4, end: 9, text: "စာတန်းထိုးများကို ဤနေရာတွင် အချိန်ကိုက် ကြည့်ရှုနိုင်ပါသည်။" },
                    { start: 9, end: 15, text: "အောင်မြင်စွာ အလုပ်လုပ်နေပါပြီ ဆရာကြီး။" }
                ];
            } else {
                subtitlesData = [
                    { start: 0, end: 4, text: "Hello, video translation is ready." },
                    { start: 4, end: 9, text: "Subtitles are synchronized successfully." },
                    { start: 9, end: 15, text: "Everything is working smoothly." }
                ];
            }

            document.getElementById('subtitle-overlay').classList.remove('hidden');
            document.getElementById('transcript-section').classList.remove('hidden');
            renderTranscriptList();

            videoPlayer.ontimeupdate = () => {
                const currentTime = videoPlayer.currentTime;
                const active = subtitlesData.find(s => currentTime >= s.start && currentTime <= s.end);
                if(active) {
                    document.getElementById('preview-subtitle-text').innerText = `"${active.text}"`;
                }
            };
        }

        function renderTranscriptList() {
            const list = document.getElementById('transcript-list');
            list.innerHTML = '';
            subtitlesData.forEach((sub, idx) => {
                const div = document.createElement('div');
                div.className = "bg-slate-950 p-2 rounded border border-slate-800 flex justify-between items-center";
                div.innerHTML = `<span><b>${sub.start}s - ${sub.end}s:</b> ${sub.text}</span>
                                 <button onclick="speakText('${sub.text}')" class="text-emerald-400 px-2 py-1"><i class="fa-solid fa-volume-high"></i></button>`;
                list.appendChild(div);
            });
        }

        function speakText(text) {
            if(!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = document.getElementById('target-lang').value === 'myanmar' ? 'my-MM' : 'en-US';
            window.speechSynthesis.speak(u);
        }

        function speakCurrentSubtitle() {
            const txt = document.getElementById('preview-subtitle-text').innerText.replace(/^"|"$/g, '');
            speakText(txt);
        }

        function openAdminModal() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }
    </script>
</body>
</html>
